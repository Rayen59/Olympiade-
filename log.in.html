<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Membres | Mémorial Assil Hamdi</title>
    <meta name="description" content="Portail d'authentification pour les candidats, élèves et membres de la direction du Mémorial Assil Hamdi.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090E;
            --bg-surface: #0E131F;
            --bg-card: rgba(17, 24, 39, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.35);
            --gold-primary: #D4AF37;
            --gold-light: #F6E27A;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --font-display: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(ellipse 70% 40% at 50% 0%, rgba(212, 175, 55, 0.12), transparent 70%),
                radial-gradient(circle 500px at 100% 100%, rgba(6, 182, 212, 0.05), transparent 70%);
            background-attachment: fixed;
        }

        /* Top Bar */
        .top-navbar {
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-gold);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 99999;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #FFFFFF;
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-back:hover {
            background: var(--gold-primary);
            color: #0B0F19;
            transform: translateX(-2px);
        }

        .nav-brand-title {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 0.5px;
        }

        /* Auth Container */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.08);
            backdrop-filter: blur(16px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-sigil {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #D4AF37, #996515);
            color: #07090E;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
        }
        .auth-title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 6px;
        }
        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Segmented Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(7, 9, 14, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 22px;
        }
        .auth-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .auth-tab-btn.active {
            background: var(--bg-surface);
            color: #FFFFFF;
            border: 1px solid rgba(212, 175, 55, 0.3);
            font-weight: 700;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #CBD5E1;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #090D16;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: #FFFFFF;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
        }

        /* Compact & Professional Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #F6E27A 0%, #D4AF37 50%, #B8860B 100%);
            color: #07090E;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 11px 18px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
            margin-top: 8px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
        }
        .btn-submit:active {
            transform: translateY(0);
        }

        /* Feedback Message */
        .alert-box {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: 16px;
            display: none;
            line-height: 1.5;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6EE7B7;
        }

        .auth-footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .auth-footer-links a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer-links a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .site-footer {
            border-top: 1px solid var(--border-subtle);
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-navbar">
        <button type="button" class="btn-back" onclick="if(window.history.length>1&&document.referrer){window.history.back();}else{window.location.href='index.html';}">
            <span>&larr;</span>
            <span>Retour / Back</span>
        </button>
        <div class="nav-brand-title">Mémorial Assil Hamdi &bull; Authentification</div>
        <a href="index.html" class="btn-back" style="border-color: rgba(255,255,255,0.15);">Accueil</a>
    </header>

    <!-- AUTH WRAPPER -->
    <main class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="auth-sigil">&Sigma;</div>
                <h1 class="auth-title" id="authHeaderTitle">Espace Candidat & Membre</h1>
                <p class="auth-subtitle">Accédez à votre compte ou enregistrez-vous pour les épreuves</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Se Connecter</button>
                <button type="button" class="auth-tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Créer un Compte</button>
            </div>

            <div id="authAlert" class="alert-box"></div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleUserLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Adresse Email</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="nom@exemple.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Mot de Passe</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="loginSubmitBtn">
                    <span>Connexion Sécurisée</span>
                    <span>&rarr;</span>
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" onsubmit="handleUserRegister(event)" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="regName">Nom Complet ou Pseudonyme</label>
                    <input type="text" id="regName" class="form-input" placeholder="Ex: Mohamed Rayen" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regEmail">Adresse Email</label>
                    <input type="email" id="regEmail" class="form-input" placeholder="nom@exemple.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regPassword">Mot de Passe (minimum 6 caractères)</label>
                    <input type="password" id="regPassword" class="form-input" placeholder="••••••••" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label" for="regCountry">Pays Représenté</label>
                    <select id="regCountry" class="form-input" required>
                        <option value="Tunisia" selected>Tunisie</option>
                        <option value="France">France</option>
                        <option value="Algeria">Algérie</option>
                        <option value="Morocco">Maroc</option>
                        <option value="Egypt">Égypte</option>
                        <option value="Lebanon">Liban</option>
                        <option value="Saudi Arabia">Arabie Saoudite</option>
                        <option value="UAE">Émirats Arabes Unis</option>
                        <option value="Canada">Canada</option>
                        <option value="Germany">Allemagne</option>
                        <option value="Other">Autre Pays</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit" id="registerSubmitBtn">
                    <span>Créer mon Compte Candidat</span>
                    <span>&rarr;</span>
                </button>
            </form>

            <div class="auth-footer-links">
                <p>Besoin d'aide ? <a href="send.html">Contacter le centre</a> &bull; <a href="exam.html">Épreuves 4h</a></p>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <p>&copy; 2026 Mémorial Assil Hamdi pour les Mathématiques Avancées &bull; Tous droits réservés.</p>
    </footer>

    <script>
        let currentTab = 'login';

        function showAlert(msg, isError = true) {
            const el = document.getElementById('authAlert');
            el.textContent = msg;
            el.className = isError ? 'alert-box alert-error' : 'alert-box alert-success';
            el.style.display = 'block';
        }

        function clearAlert() {
            const el = document.getElementById('authAlert');
            el.style.display = 'none';
        }

        function switchAuthTab(tab) {
            currentTab = tab;
            clearAlert();
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegBtn = document.getElementById('tabRegisterBtn');
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const titleEl = document.getElementById('authHeaderTitle');

            if (tab === 'login') {
                tabLoginBtn.classList.add('active');
                tabRegBtn.classList.remove('active');
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                titleEl.textContent = 'Espace Candidat & Membre';
            } else {
                tabRegBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                titleEl.textContent = 'Inscription au Concours';
            }
        }

        async function handleUserLogin(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById('loginSubmitBtn');
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            btn.disabled = true;
            btn.innerHTML = '<span>Vérification...</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Identifiants invalides');

                // Store token
                localStorage.setItem('olympiad_token', data.token);
                showAlert('Connexion réussie ! Redirection en cours...', false);

                setTimeout(() => {
                    if (data.user && data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'exam.html';
                    }
                }, 700);
            } catch (err) {
                showAlert(err.message, true);
                btn.disabled = false;
                btn.innerHTML = '<span>Connexion Sécurisée</span> <span>&rarr;</span>';
            }
        }

        async function handleUserRegister(e) {
            e.preventDefault();
            clearAlert();
            const btn = document.getElementById('registerSubmitBtn');
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const country = document.getElementById('regCountry').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Création du compte...</span>';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, country })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Échec de l'enregistrement");

                localStorage.setItem('olympiad_token', data.token);
                showAlert('Compte candidat créé avec succès ! Redirection vers les épreuves...', false);

                setTimeout(() => {
                    window.location.href = 'exam.html';
                }, 800);
            } catch (err) {
                showAlert(err.message, true);
                btn.disabled = false;
                btn.innerHTML = '<span>Créer mon Compte Candidat</span> <span>&rarr;</span>';
            }
        }
    </script>
</body>
</html>
