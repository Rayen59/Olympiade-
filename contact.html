<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Sniglet|Raleway:900);

        body, html {
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Sniglet', cursive;
        }
        h1 {
            font-weight: normal;
            font-size: 4em;
            font-family: 'Raleway', sans-serif;
            margin: 0 auto;
            margin-top: 30px;
            width: 500px;
            color: #F90;
            text-align: center;
        }

        /* Animation webkit */
        @-webkit-keyframes myfirst {
            0% {margin-left: -235px}
            90% {margin-left: 100%;}
            100% {margin-left: 100%;}
        }

        /* Animation */
        @keyframes myfirst {
            0% {margin-left: -235px}
            70% {margin-left: 100%;}
            100% {margin-left: 100%;}
        }

        .fish {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/fish.png');
            width: 235px;
            height: 104px;
            margin-left: -235px;
            position: absolute;    
            animation: myfirst 24s;
            -webkit-animation: myfirst 24s;
            animation-iteration-count: infinite;
            -webkit-animation-iteration-count: infinite;
            animation-timing-function: linear;
            -webkit-animation-timing-function: linear;
        }

        #fish {
            top: 120px;
        }

        #fish2 {
            top: 260px;
            animation-delay: 12s;
            -webkit-animation-delay: 12s;
        }

        header {
            height: 160px;
            background: url('http://www.geertjanhendriks.nl/codepen/form/golf.png') repeat-x bottom;
        }

        #form {
            height: 100%;    
            background-color: #98d4f3;
            overflow: hidden;
            position: relative;
        }
        form {
            margin: 0 auto;
            width: 500px;
            padding-top: 40px;
            color: white;
            position: relative;
        }
        label, input, textarea {
            display: block;    
        }
        input, textarea {
            width: 500px;    
            border: none;
            border-radius: 20px;
            outline: none;
            padding: 10px;
            font-family: 'Sniglet', cursive;
            font-size: 1em;
            color: #676767;
            transition: border 0.5s;
            -webkit-transition: border 0.5s;
            -moz-transition: border 0.5s;
            -o-transition: border 0.5s;
            border: solid 3px #98d4f3;    
            -webkit-box-sizing:border-box;
            -moz-box-sizing:border-box;
            box-sizing:border-box;
        }
        input:focus, textarea:focus {
            border: solid 3px #77bde0;    
        }

        textarea {
            height: 100px;    
            resize: none; 
            overflow: auto;
        }
        input[type="submit"] {
            background-color: #F90;
            color: white;
            height: 50px;
            cursor: pointer;
            margin-top: 30px;
            font-size: 1.29em;
            font-family: 'Sniglet', cursive;
            -webkit-transition: background-color 0.5s;
            -moz-transition: background-color 0.5s;
            -o-transition: background-color 0.5s;
            transition: background-color 0.5s;
        }
        input[type="submit"]:hover {
            background-color: #e58f0e;
        }
        label {
            font-size: 1.5em;
            margin-top: 20px;
            padding-left: 20px;
        }
        .formgroup, .formgroup-active, .formgroup-error {
            background-repeat: no-repeat;
            background-position: right bottom;
            background-size: 10.5%;
            transition: background-image 0.7s;
            -webkit-transition: background-image 0.7s;
            -moz-transition: background-image 0.7s;
            -o-transition: background-image 0.7s;
            width: 566px;
            padding-top: 2px;
        }

        .formgroup {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/pixel.gif');    
        }
        .formgroup-active {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/octo.png');
        }
        .formgroup-error {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/octo-error.png');
            color: red;
        }
    </style>
</head>
<body>
    <!-- Navigation Retour Permanente -->
    <div style="background: #1A1514; width: 100%; box-sizing: border-box; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #D4AF37; position: sticky; top: 0; z-index: 999999; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <button type="button" onclick="if(window.history.length>1&&document.referrer){window.history.back();}else{window.location.href='index.html';}" style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); color: #FFFFFF; border: 1px solid rgba(212,175,55,0.4); padding: 7px 16px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.2s;" onmouseover="this.style.background='#D4AF37';this.style.color='#1A1514'" onmouseout="this.style.background='rgba(255,255,255,0.12)';this.style.color='#FFFFFF'" title="Retour au Mémorial">
            <span style="font-size: 18px; line-height: 1;">&larr;</span>
            <span>Retour / Back</span>
        </button>
        <div style="color: #D4AF37; font-weight: 700; font-size: 14px; letter-spacing: 0.5px;">
            Mémorial Assil Hamdi &bull; Contact
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="index.html" style="color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 4px; background: rgba(255,255,255,0.08);">Accueil</a>
            <a href="exam.html" style="color: #1A1514; text-decoration: none; font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 4px; background: #D4AF37;">Épreuves 4h</a>
        </div>
    </div>
    <header>
        <h1>Contact us</h1>
    </header>
    
    <div id="form">
        <div class="fish" id="fish"></div>
        <div class="fish" id="fish2"></div>
        
        <form id="waterform" action="mailto:matholympiad40@gmail.com" method="post" enctype="text/plain">
            <div class="formgroup" id="name-form">
                <label for="name">Your name*</label>
                <input type="text" id="name" name="name" required />
            </div>
            
            <div class="formgroup" id="email-form">
                <label for="email">Your e-mail*</label>
                <input type="email" id="email" name="email" required />
            </div>
            
            <div class="formgroup" id="message-form">
                <label for="message">Your message</label>
                <textarea id="message" name="message"></textarea>
            </div>
            
            <input type="submit" value="Send your message!" />
        </form>
    </div>
</body>
</html>
